name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check
        run: node test/check.mjs
      - name: Unit tests
        run: node test/unit.mjs
      - name: Wiring harness
        run: node test/verify-harness.mjs
